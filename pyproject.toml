[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenzcontext"
dynamic = ["version"]
description = "Batch JPEG context extraction with local GeoNames and vision LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "pydantic>=2,<3", "PyYAML>=6", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lenzcontext = "lenzcontext.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lenzcontext.__version__"}

[tool.setuptools.packages.find]
include = ["lenzcontext*"]

[tool.setuptools.data-files]
"share/lenzcontext/config" = ["config/prompts.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
